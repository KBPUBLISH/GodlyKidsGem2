[build]
  command = "npm run living-test:build"
  publish = "dist"

# The live app uses the same onboarding and rebuilt island as this branch.
[context."codex/living-world-player-test"]
  command = "npm run living-test:build"

[images]
  remote_images = ['https://storage\.googleapis\.com/productiongk/.*', 'https://backendgk2-0\.onrender\.com/uploads/.*']

[[headers]]
  for = "/preview-islands.json"
  [headers.values]
    Cache-Control = "no-cache"

# Existing static files take precedence. A removed hashed build asset gets a
# JavaScript 404 instead of index.html, allowing stale-deploy recovery to run.
[[redirects]]
  from = "/assets/*"
  to = "/asset-not-found.js"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache policy. index.html stays revalidated so a deploy is picked up at once;
# everything it references is either content-hashed (Vite chunks) or versioned
# by a `?v=` query / rarely changes (art, GLB models, Draco decoder, sounds),
# so a day in the HTTP cache is safe and lets the first-launch background
# prefetch (utils/assetPreloader.ts) actually pay off on the crew page.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/homeworld/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/homeworld/living-test.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"



